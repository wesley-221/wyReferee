<div class="container-fluid">
	<div class="row">
		<div class="col">
			<div class="buttons">
				<button type="button" class="form-button" (click)="createNewMappool()">
					<mat-icon>add</mat-icon> Create new mappool
				</button>

				<button type="button" class="form-button" (click)="importWyBinMappool()" [disabled]="importingFromWyBin" *ngIf="tournament.hasWyBinConnected()">
					<mat-icon class="sync" [ngClass]="{'rotate': importingFromWyBin == true}">sync</mat-icon> Import mappool from wyBin
				</button>
			</div>

			<div class="wybin-import" *ngIf="tournament.hasWyBinConnected() && wyBinMappools.length > 0">
				<mat-slide-toggle [(ngModel)]="addNoFail">Add NoFail to all mod brackets when importing</mat-slide-toggle>

				<div class="wybin-mappools">
					<button type="button" class="pill-button" *ngFor="let mappool of wyBinMappools" (click)="importMappool(mappool)">
						<mat-icon>download</mat-icon> Import {{ mappool.name }}
					</button>
				</div>
			</div>

			<form [formGroup]="form">
				<app-alert alertType="warn" *ngIf="mappools.length == 0">
					There are no mappools yet.
				</app-alert>

				<div class="mappools" *ngIf="mappools.length > 0">
					<nav class="mappool-tabs">
						<button *ngFor="let mappoolGroup of mappools.controls; let i = index" class="pill-button" [class.active]="activeMappoolIndex === i" (click)="selectMappool(i)">
							{{ mappoolGroup.get('name')?.value || 'Unnamed Mappool' }}
						</button>
					</nav>

					<div class="mappool-panel" formArrayName="mappools">
						<ng-container [formGroupName]="activeMappoolIndex">
							<app-mappool
								[tournament]="tournament"
								[form]="getMappoolFormArray(activeMappoolIndex)"
								[mappoolIndex]="activeMappoolIndex"
								[mappoolCount]="mappools.length"
								(moveEarlier)="moveMappoolEarlier(activeMappoolIndex)"
								(moveLater)="moveMappoolLater(activeMappoolIndex)"
								(deleteMappool)="deleteMappool(activeMappoolIndex)"
							></app-mappool>
						</ng-container>
					</div>
				</div>
			</form>
		</div>
	</div>
</div>
